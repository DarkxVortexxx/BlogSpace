<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | BlogSpace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f6f1;
            margin: 0;
            color: #252525;
        }

        header {
            padding: 25px 8%;
            background: white;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: #ed7954;
            text-decoration: none;
        }

        .profile-card {
            background: white;
            max-width: 550px;
            margin: 70px auto;
            padding: 40px;
            border-radius: 18px;
        }

        h1 {
            font-size: 32px;
        }

        label {
            display: block;
            margin-top: 22px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            padding: 14px 25px;
            background: #ed7954;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h2>BlogSpace.</h2>
        <a href="/dashboard.html">← Dashboard</a>
    </header>

    <div class="profile-card">

        <h1>My Profile 👤</h1>
        <p>Manage your personal information.</p>

        <label>Username</label>
        <input type="text" id="username" readonly>

        <label>Email</label>
        <input type="email" id="email" readonly>

        <label>Profile Picture</label>
        <input type="file" id="profilePicture" accept="image/*">

        <img id="profilePreview" src=""
            style="width:100px;height:100px;border-radius:50%;object-fit:cover;display:none;">

        <label>About Me</label>
        <textarea id="bio" rows="5" placeholder="Tell us something about yourself..."></textarea>

        <button onclick="saveProfile()">Save Profile</button>

        <p id="message"></p>

    </div>

    <script>
        async function loadProfile() {
            await fetch("/api/accounts/csrf/", {
                credentials: "same-origin"
            });

            const response = await fetch("/api/accounts/profile/", {
                credentials: "same-origin"
            });

            if (!response.ok) {
                document.getElementById("message").textContent =
                    "Please login first.";
                return;
            }

            const data = await response.json();

            document.getElementById("username").value = data.username;
            document.getElementById("email").value = data.email;
            document.getElementById("bio").value = data.bio;

            if (data.profile_picture) {
                const preview = document.getElementById("profilePreview");
                preview.src = data.profile_picture;
                preview.style.display = "block";
            }
        }

        // Preview selected image
        document.getElementById("profilePicture").addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                const preview = document.getElementById("profilePreview");
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        async function saveProfile() {
            const csrf = document.cookie.split("; ")
                .find(row => row.startsWith("csrftoken="))
                ?.split("=")[1];

            const formData = new FormData();

            formData.append("bio", document.getElementById("bio").value);

            const image = document.getElementById("profilePicture").files[0];

            if (image) {
                formData.append("profile_picture", image);
            }

            const response = await fetch("/api/accounts/profile/", {
                method: "PATCH",
                credentials: "same-origin",
                headers: {
                    "X-CSRFToken": csrf
                },
                body: formData
            });

            const message = document.getElementById("message");

            if (response.ok) {
                message.textContent = "Profile updated successfully! 🎉";
                document.getElementById("profilePicture").value = "";
                await loadProfile();
            } else {
                message.textContent = "Could not update profile.";
            }
        }

        loadProfile();
    </script>

</body>

</html>
