<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Blog | BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Blog<span>Space.</span></div>
        <a href="/" style="text-decoration:none;color:#e87955;">
            ← Back to Home
        </a>
    </header>

    <main class="post-page">
        <div id="postContent">
            <p>Loading article...</p>
        </div>
        <section class="comments-section">

            <h2>Comments 💬</h2>

            <form id="commentForm">
                <textarea id="commentText" placeholder="Share your thoughts..." required></textarea>
                <input type="hidden" id="parentComment" value="">

                <button type="submit" class="primary-btn">
                    Post Comment
                </button>
            </form>

            <div id="commentsContainer">
                Loading comments...
            </div>

        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");

        const API = `/api/posts/${encodeURIComponent(slug)}/comments/`;

        function getCSRFToken() {
            return document.cookie
                .split("; ")
                .find(row => row.startsWith("csrftoken="))
                ?.split("=")[1];
        }

        // LOAD BLOG
        async function loadPost() {
            const container = document.getElementById("postContent");

            try {
                const response = await fetch(
                    `/api/posts/${encodeURIComponent(slug)}/`
                );

                if (!response.ok) throw new Error("Article not found");

                const post = await response.json();

                const title = document.createElement("h1");
                title.textContent = post.title;

                const meta = document.createElement("p");
                meta.className = "post-meta";
                meta.textContent =
                    `By ${post.author} · ${post.reading_time} min read`;

                const content = document.createElement("div");
                content.className = "post-body";
                content.textContent = post.content;

                container.replaceChildren(title, meta, content);
                document.title = post.title + " | BlogSpace";

            } catch (error) {
                container.textContent = "Could not load article.";
            }
        }

        // LOAD COMMENTS
        async function loadComments() {
            const container = document.getElementById("commentsContainer");

            try {
                const response = await fetch(API);
                const comments = await response.json();

                container.innerHTML = "";

                if (comments.length === 0) {
                    container.textContent = "No comments yet. Be the first!";
                    return;
                }

                comments.forEach(comment => {
                    const card = document.createElement("div");
                    card.className = "comment-card";

                    const username = document.createElement("strong");
                    username.textContent = comment.user;

                    const text = document.createElement("p");
                    text.textContent = comment.text;

                    const date = document.createElement("small");
                    date.textContent =
                        new Date(comment.created_at).toLocaleString();

                    card.append(username, text, date);
                    // DELETE COMMENT BUTTON
                    const deleteButton = document.createElement("button");
                    deleteButton.className = "reply-btn";
                    deleteButton.textContent = "Delete";

                    deleteButton.onclick = async () => {
                        if (!confirm("Are you sure you want to delete this comment?")) {
                            return;
                        }

                        await fetch("/api/accounts/csrf/", {
                            credentials: "same-origin"
                        });

                        const response = await fetch(
                            `/api/comments/${comment.id}/`,
                            {
                                method: "DELETE",
                                credentials: "same-origin",
                                headers: {
                                    "X-CSRFToken": getCSRFToken()
                                }
                            }
                        );

                        if (response.ok) {
                            loadComments();
                        } else {
                            alert("You don't have permission to delete this comment.");
                        }
                    };

                    card.appendChild(deleteButton);

                    // REPLY BUTTON
                    const replyButton = document.createElement("button");
                    replyButton.className = "reply-btn";
                    replyButton.textContent = "Reply";

                    replyButton.onclick = () => {
                        document.getElementById("commentText").value =
                            `@${comment.user} `;

                        document.getElementById("parentComment").value =
                            comment.id;

                        document.getElementById("commentText").focus();
                    };

                    card.appendChild(replyButton);

                    // SHOW REPLIES
                    if (comment.replies) {
                        comment.replies.forEach(reply => {
                            const replyCard = document.createElement("div");
                            replyCard.className = "comment-card";
                            replyCard.style.marginLeft = "30px";

                            const replyUser = document.createElement("strong");
                            replyUser.textContent = reply.user;

                            const replyText = document.createElement("p");
                            replyText.textContent = reply.text;

                            replyCard.append(replyUser, replyText);
                            card.appendChild(replyCard);
                        });
                    }

                    container.appendChild(card);
                });

            } catch (error) {
                container.textContent = "Could not load comments.";
                console.error(error);
            }
        }

        // POST COMMENT OR REPLY
        document.getElementById("commentForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                const text = document.getElementById("commentText").value.trim();
                const parent = document.getElementById("parentComment").value;

                if (!text) return;

                await fetch("/api/accounts/csrf/", {
                    credentials: "same-origin"
                });

                try {
                    const response = await fetch(API, {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": getCSRFToken()
                        },
                        body: JSON.stringify({
                            text: text,
                            parent: parent || null
                        })
                    });

                    if (response.status === 401 || response.status === 403) {
                        alert("Please login to comment!");
                        return;
                    }

                    if (!response.ok) {
                        const error = await response.json();
                        alert(JSON.stringify(error));
                        return;
                    }

                    document.getElementById("commentText").value = "";
                    document.getElementById("parentComment").value = "";

                    loadComments();

                } catch (error) {
                    console.error(error);
                    alert("Something went wrong!");
                }
            });

        loadPost();
        loadComments();
    </script>

</body>

</html>
